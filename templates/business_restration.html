<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Set Up Your Business</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #f4f7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .container {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header .logo {
        width: 55px;
        height: 55px;
        background: #2563eb;
        color: white;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        font-size: 24px;
        font-weight: bold;
    }

    .header h1 {
        color: #111827;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .header p {
        color: #6b7280;
        font-size: 15px;
    }

    .progress {
        display: flex;
        align-items: center;
        margin-bottom: 35px;
    }

    .step {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #2563eb;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
    }

    .line {
        flex: 1;
        height: 2px;
        background: #2563eb;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        background: #fff;
        transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .button:hover {
        background: #1d4ed8;
    }

    .required {
        color: #ef4444;
    }

    .footer-text {
        text-align: center;
        margin-top: 20px;
        color: #9ca3af;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .container {
            padding: 25px 20px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .header h1 {
            font-size: 24px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">

    <div class="header">

        <div class="logo">
            B
        </div>

        <h1>Set Up Your Business</h1>

        <p>
            Tell us a little about your business to get started.
        </p>

    </div>


    <!-- Progress -->

    <div class="progress">

        <div class="step">1</div>

        <div class="line"></div>

        <div class="step">2</div>

        <div class="line"></div>

        <div class="step">3</div>

    </div>


    <form method="POST">

        {% csrf_token %}


        <!-- Business Name -->

        <div class="form-group">

            <label for="business_name">
                Business Name <span class="required">*</span>
            </label>

            <input
                type="text"
                id="business_name"
                name="business_name"
                placeholder="e.g. ABC Traders"
                required
            >

        </div>


        <!-- Business Type + Phone -->

        <div class="form-row">

            <div class="form-group">

                <label for="business_type">
                    Business Type <span class="required">*</span>
                </label>

                <select
                    id="business_type"
                    name="business_type"
                    required
                >

                    <option value="">Select type</option>

                    <option value="retail">Retail</option>

                    <option value="wholesale">Wholesale</option>

                    <option value="restaurant">Restaurant</option>

                    <option value="service">Service Business</option>

                    <option value="manufacturing">Manufacturing</option>

                    <option value="ecommerce">E-commerce</option>

                    <option value="other">Other</option>

                </select>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+91 98765 43210"
                >

            </div>

        </div>


        <!-- Email + Website -->

        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Business Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="business@example.com"
                >

            </div>


            <div class="form-group">

                <label for="website">
                    Website
                </label>

                <input
                    type="url"
                    id="website"
                    name="website"
                    placeholder="https://example.com"
                >

            </div>

        </div>


        <!-- Address -->

        <div class="form-group">

            <label for="address">
                Business Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your business address"
            ></textarea>

        </div>


        <!-- City + Country -->

        <div class="form-row">

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="e.g. Jodhpur"
                >

            </div>


            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <select id="country" name="country">

                    <option value="IN">India</option>

                    <option value="US">United States</option>

                    <option value="UK">United Kingdom</option>

                    <option value="AU">Australia</option>

                    <option value="CA">Canada</option>

                </select>

            </div>

        </div>


        <!-- Currency + Timezone -->

        <div class="form-row">

            <div class="form-group">

                <label for="currency">
                    Currency
                </label>

                <select id="currency" name="currency">

                    <option value="INR">₹ INR - Indian Rupee</option>

                    <option value="USD">$ USD - US Dollar</option>

                    <option value="EUR">€ EUR - Euro</option>

                    <option value="GBP">£ GBP - British Pound</option>

                </select>

            </div>


            <div class="form-group">

                <label for="timezone">
                    Timezone
                </label>

                <select id="timezone" name="timezone">

                    <option value="Asia/Kolkata">
                        India Standard Time
                    </option>

                    <option value="America/New_York">
                        Eastern Time
                    </option>

                    <option value="America/Los_Angeles">
                        Pacific Time
                    </option>

                    <option value="Europe/London">
                        London
                    </option>

                </select>

            </div>

        </div>


        <button type="submit" class="button">
            Create Business & Continue
        </button>

    </form>


    <div class="footer-text">
        You can change these details later from Business Settings.
    </div>

</div>
```

</body>
</html>
