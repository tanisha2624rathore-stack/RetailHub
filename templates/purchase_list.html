<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h2 class="text-center">Purchase Dashboard</h2>
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-10">
                    <input type="text"
                           id="search_input"
                           class="form-control"
                           placeholder="Search Customer">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-success w-100" id="search_button">
                        Search
                    </button>
                </div>

            </div>

            <table class="table table-bordered table-hover text-center">

                <thead class="table-primary">

                    <tr>

                        <th>Compnay Name</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>qty</th>
                        <th>TotalPrice</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="table_body">

                </tbody>

            </table>

            <div class="text-end">

                <a href="{% url 'purchase' %}"
                   class="btn btn-primary">

                    + Add New Purchase

                </a>

                <a href="{% url 'purchase_list' %}"
                   class="btn btn-primary">

                     BACK

                </a>

            </div>

        </div>

    </div>

</div>
</body>
</html>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  let html = '';

$.ajax({
    url: "/api/purchase_list_api/",
    method: "GET",

    success: function(response) {
        console.log(response);

        $.each(response.result, function(index, item) {

            html += `
                <tr>
                    <td>${item.company_name}</td>
                    <td>${item.product_name}</td>
                    <td>${item.price}</td>
                    <td>${item.qty}</td>
                    <td>${item.total_price}</td>

                    <td>
                        <i class="fa-solid fa-pen-to-square"
                           style="cursor:pointer;"
                           onclick="update_purchase(${item.id})">
                        </i>

                        <i class="fa-solid fa-trash text-danger"
                           style="cursor:pointer;"
                           onclick="delete_purchase(${item.id})"
                           title="Delete">
                        </i>
                    </td>
                </tr>
            `;
        });

        $("#table_body").html(html);
    },

    error: function(error) {
        console.log(error);
    }
});


function update_purchase(id) {
    console.log("id", id);
    window.location.href = `/update_purchase/${id}/`;
}


function delete_purchase(id) {

    Swal.fire({
        title: "Sure you want to delete?",
        showCancelButton: true
    }).then((result) => {

        if (result.isConfirmed) {
            window.location.href = `/delete_purchase/${id}/`;
        }

    });
}


$("#search_button").click(function(e) {

    e.preventDefault();

    let search_input = $("#search_input").val();

    $.ajax({
        url: "/filter_purchase_data/",
        type: "GET",

        data: {
            search_input: search_input
            
        },

        success:function(response) {
          
            console.log("FULL RESPONSE:", response);
            console.log("DATA:", response.data);

            $("#table_body").empty();
            $.each(response.data, function(index, row) {
                $("#table_body").append(`
                 <tr>
                        <td>${row[0]}</td>
                        <td>${row[1]}</td>
                        <td>${row[2]}</td>
                        <td>${row[3]}</td>
                        <td>${row[4]}</td>
                    </tr>`

                )
                                
            });
             
             
        },
        error:function(response) {
            console.log(response);
        }
    });

});


    
    

</script>
