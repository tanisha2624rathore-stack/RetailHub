name: Django Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django
        run: pip install django

      - name: Install Flake8
        run: pip install flake8

      - name: Run code quality check
        run: flake8 .

      - name: Run Django tests
        run: python manage.py test